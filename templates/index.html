<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flask Login Page</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
        }
        .card {
            border-radius: 15px;
        }
    </style>
</head>
<body class="d-flex justify-content-center align-items-center">

<div class="card shadow-lg p-4" style="width: 400px;">
    <h3 class="text-center mb-3 text-primary">Flask App</h3>

    {% if logged_in %}
    <div class="alert alert-success text-center">
        You are logged in
    </div>
    <div class="d-grid mb-3">
        <a href="/logout" class="btn btn-danger">Logout</a>
    </div>
    {% else %}
    <div class="alert alert-warning text-center">
        You are logged out
    </div>
    <div class="d-grid mb-3">
        <a href="/login" class="btn btn-success">Login</a>
    </div>
    {% endif %}

    <hr>

    <form method="POST">
        <div class="input-group mb-3">
            <input type="text" name="search" class="form-control" placeholder="Search here..." required>
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>

    {% if search_query %}
    <div class="alert alert-info text-center">
        You searched for: <strong>{{ search_query }}</strong>
    </div>
    {% endif %}
</div>

</body>
</html>
